# Bundle patch applied over the selected DSH profile when this package is listed
# in `dsh.profile.bundles`. The row id is deployment-local; the package name
# must match package.json. Comem requires the profile to provide storageDomain;
# it does not provide a filesystem or JSONL persistence fallback. The standard
# Web profile also supplies the DSH settings service used by the Comem settings page.

- insert:
    - id: comem
      name: 'comem'
      config:
        logicalLayerCap: 102400

    # The `./invariant` export remains available for profiles that mount
    # `@deepseek-ai/dsh-invariants`. The ordinary dsh-base/web-app profiles do
    # not provide that service, so do not insert the companion row here; doing
    # so would leave it pending during startup.
